<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Didasko AI 🦉</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="assets/logo/favicon_io/favicon.ico">
    <link rel="manifest" href="pwa/manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/bienvenida.css">
    <link rel="stylesheet" href="css/secciones.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/animations.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
          processEscapes: true,
          processEnvironments: true
        },
        options: {
          skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
          ignoreHtmlClass: 'tex2jax_ignore',
          processHtmlClass: 'tex2jax_process'
        },
        svg: { fontCache: 'global' }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        body { visibility: hidden; }
        
        .tab-salir {
            background: linear-gradient(135deg, #e74c3c, #c0392b) !important;
            color: white !important;
            font-weight: 600 !important;
        }
        
        .tab-salir:hover {
            background: linear-gradient(135deg, #ff6b5c, #d84332) !important;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4) !important;
        }
        
        .btn-salir-movil {
            background: linear-gradient(135deg, #e74c3c, #c0392b) !important;
            border: 3px solid #ff6b5c !important;
        }
        
        .btn-salir-movil:hover {
            background: linear-gradient(135deg, #ff6b5c, #d84332) !important;
            box-shadow: 0 8px 20px rgba(231, 76, 60, 0.4) !important;
        }
        
        .btn-salir-movil .icono-app {
            width: 60px;
            height: 60px;
            display: flex !important;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            background: transparent !important;
        }
        
        .btn-salir-movil .texto-boton {
            color: white !important;
            font-weight: 700;
        }
    </style>
    <script>
    (function() {
        fetch('/api/auth/me', { credentials: 'include' })
            .then(r => r.json())
            .then(data => {
                if (!data.success || !data.logueado) {
                    window.location.replace('/login.html');
                } else {
                    localStorage.setItem('didasko_usuario', JSON.stringify(data.usuario));
                    document.body.style.visibility = 'visible';
                }
            })
            .catch(() => {
                window.location.replace('/login.html');
            });
    })();
    </script>
</head>
<body>

    <!-- 📁 PESTAÑAS TIPO FOLDER (Solo visibles en PC) -->
    <nav class="tabs-web">
        <button onclick="irA('chat')" class="tab-link active">🦉 Chat (Principal)</button>
        <button onclick="irA('imagen')" class="tab-link">🖼️ Crear imagen</button>
        <button onclick="irA('vision')" class="tab-link">🔍 Analizar Foto</button>
        <button onclick="irA('profeta')" class="tab-link">⚽ Profeta Deportivo</button>
        <button onclick="irA('apoyar')" class="tab-link">💰 Apoyar el proyecto</button>
        <button onclick="cerrarSesionDidasko()" class="tab-link tab-salir">🚪 Salir</button>
    </nav>

    <!-- 🏠 BIENVENIDA (Solo visible en MÓVIL) -->
    <section id="bienvenida" class="pantalla">
        <div class="bienvenida-container">
            <img src="assets/logo/buho-columna.png" class="logo-principal" alt="Didasko AI">
            <h1 class="titulo-principal">Didasko AI</h1>
            <p class="subtitulo">¡Bienvenido a tu tutor con IA! 🦉<br>Aprende, crea y descubre.</p>
            <div class="menu-principal">
                <button onclick="irA('chat')">
                    <img src="assets/iconos-app/icono-chat.png" class="icono-app">
                    <span class="texto-boton">Chat</span>
                </button>
                <button onclick="irA('imagen')">
                    <img src="assets/iconos-app/icono-imagen.png" class="icono-app">
                    <span class="texto-boton">Crear Imagen</span>
                </button>
                <button onclick="irA('vision')">
                    <img src="assets/iconos-app/icono-vision.png" class="icono-app">
                    <span class="texto-boton">Analizar Foto</span>
                </button>
                <button onclick="irA('profeta')">
                    <span class="icono-app" style="display:flex;align-items:center;justify-content:center;font-size:60px;">⚽</span>
                    <span class="texto-boton">Profeta Deportivo</span>
                </button>
                <button onclick="irA('apoyar')">
                    <img src="assets/iconos-app/icono-apoyar.png" class="icono-app">
                    <span class="texto-boton">Apoyar</span>
                </button>
                <button onclick="cerrarSesionDidasko()" class="btn-salir-movil">
                    <span class="icono-app">🚪</span>
                    <span class="texto-boton">Salir</span>
                </button>
            </div>
        </div>
    </section>

    <!-- 💬 SECCIÓN CHAT -->
    <section id="chat" class="pantalla">
        <div class="header-seccion movil-only">
            <button onclick="volverInicio()">⬅️</button>
            <h2>🦉 Chat Didasko AI</h2>
        </div>
        <div id="chat-mensajes" class="contenido"></div>
        <div class="input-area">
            <img src="assets/logo/buho-mascota.png" class="mascota">
            <input type="text" id="chat-input" placeholder="Escribe tu pregunta...">
            <button onclick="enviarMensaje()">➤</button>
        </div>
    </section>

    <!-- 🖼️ SECCIÓN IMAGEN -->
    <section id="imagen" class="pantalla">
        <div class="header-seccion movil-only">
            <button onclick="volverInicio()">⬅️</button>
            <h2>🖼️ Crear / Editar Imagen</h2>
        </div>

        <div class="modo-selector">
            <button class="btn-modo active" data-modo="crear" onclick="seleccionarModo('crear')">🖼️ Crear</button>
            <button class="btn-modo" data-modo="editar" onclick="seleccionarModo('editar')">✏️ Editar</button>
        </div>

        <div id="imagen-resultado" class="contenido centrado"></div>

        <div class="formato-selector" id="formato-selector">
            <span class="formato-label">Formato:</span>
            <button class="btn-formato active" data-formato="1:1" onclick="seleccionarFormato('1:1')">⬛ 1:1</button>
            <button class="btn-formato" data-formato="16:9" onclick="seleccionarFormato('16:9')">🖥️ 16:9</button>
            <button class="btn-formato" data-formato="9:16" onclick="seleccionarFormato('9:16')">📱  9:16</button>
        </div>

        <input type="file" id="imagen-editar-file" accept="image/*" style="display:none">

        <div class="input-area">
            <button id="btn-subir-imagen" onclick="document.getElementById('imagen-editar-file').click()" style="display:none" title="Subir imagen">📁</button>
            <input type="text" id="imagen-input" placeholder="Describe tu imagen...">
            <button onclick="procesarImagen()">➤</button>
        </div>
    </section>

    <!-- 🔍 SECCIÓN VISIÓN -->
    <section id="vision" class="pantalla">
        <div class="header-seccion movil-only">
            <button onclick="volverInicio()">⬅️</button>
            <h2>🔍 Analizar Foto</h2>
        </div>
        <div id="vision-resultado" class="contenido centrado"></div>
        <div class="input-area">
            <input type="file" id="vision-file" accept="image/*" style="display:none">
            <input type="file" id="vision-camara" accept="image/*" capture="environment" style="display:none">
            <button onclick="document.getElementById('vision-file').click()" title="Subir de galería">🖼️</button>
            <button onclick="document.getElementById('vision-camara').click()" title="Tomar foto con cámara">📸</button>
            <input type="text" id="vision-input" placeholder="Describe lo que quieres extraer...">
            <button onclick="analizarImagen()">➤</button>
        </div>
    </section>

    <!-- ⚽ SECCIÓN PROFETA DEPORTIVO -->
    <section id="profeta" class="pantalla">
        <div class="header-seccion movil-only">
            <button onclick="volverInicio()">⬅️</button>
            <h2>⚽ Profeta Deportivo</h2>
        </div>
        <div id="profeta-resultado" class="contenido centrado"></div>
    </section>

    <!-- 💰 SECCIÓN APOYAR -->
    <section id="apoyar" class="pantalla">
        <div class="header-seccion movil-only">
            <button onclick="volverInicio()">⬅️</button>
            <h2>💰 Apoyar Proyecto</h2>
        </div>
        <div class="contenido centrado">
            <div class="pago-card">
                <img src="assets/pagos/paypal.png">
                <p>cortezandres868@gmail.com</p>
            </div>
            <div class="pago-card">
                <img src="assets/pagos/nequi.png">
                <p>3171547065</p>
            </div>
        </div>
    </section>

    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
    <script src="js/navegacion.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/imagen.js"></script>
    <script src="js/vision.js"></script>
    <script src="js/profeta.js"></script>
    <script src="js/publicidad.js"></script>
    <script src="js/apoyar.js"></script>
    <script src="js/auth.js"></script>

    <script>
        function cerrarSesionDidasko() {
            if (confirm('🤔 ¿Seguro que quieres cerrar sesión?')) {
                cerrarSesion();
            }
        }
    </script>
</body>
</html>
